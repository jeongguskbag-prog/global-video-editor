name: Flutter Android APK

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK (debug-signed, split per ABI)
        run: flutter build apk --release --split-per-abi

      # 이 프로토타입엔 아직 별도 release keystore가 없어서(android/app/build.gradle.kts가
      # debug 서명을 쓰도록 되어 있음) 지금은 디버그 서명 APK를 만든다. 개인 사이드로드용으로는
      # 충분하지만, 스토어 배포 전엔 반드시 release keystore로 교체해야 한다.
      - name: Publish APKs to apk-releases branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/apk-out
          cp build/app/outputs/flutter-apk/*.apk /tmp/apk-out/

          cd /tmp
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch apk-releases "$REMOTE" apk-releases-repo; then
            cd apk-releases-repo
          else
            mkdir apk-releases-repo
            cd apk-releases-repo
            git init -q
            git checkout --orphan apk-releases
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find . -maxdepth 1 -iname "*.apk" -delete
          cp /tmp/apk-out/*.apk .

          git add -A
          git commit -m "APK build for ${GITHUB_SHA}" || echo "No APK changes"
          git push --force "$REMOTE" HEAD:apk-releases

name: Build KR Stock App APK

on:
  push:
    paths:
      - "kr_stock_app/**"
      - ".github/workflows/kr-stock-app-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kr_stock_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-krstock-${{ runner.os }}-${{ hashFiles('kr_stock_app/android/**/*.gradle*', 'kr_stock_app/android/gradle/wrapper/gradle-wrapper.properties', 'kr_stock_app/pubspec.lock') }}
          restore-keys: |
            gradle-krstock-${{ runner.os }}-

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK (universal + arm64)
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/kr-stock-app-universal.apk
          flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/kr-stock-app-arm64.apk
          ls -la build/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kr-stock-app-apk
          path: kr_stock_app/build/kr-stock-app-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kr-stock-app-build-${{ github.run_number }}
          name: 국내주식 자동매매 앱 (빌드 ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            국내주식 자동매매 Android 앱 (브랜치 `${{ github.ref_name }}`, 커밋 ${{ github.sha }}).
            - 대부분의 최신 휴대폰: `kr-stock-app-arm64.apk`
            - 설치가 안 되면: `kr-stock-app-universal.apk`
            처음에는 설정에서 '모의매매' 또는 증권사 모의투자로 충분히 확인한 뒤 사용하세요.
          files: |
            kr_stock_app/build/kr-stock-app-universal.apk
            kr_stock_app/build/kr-stock-app-arm64.apk
